name: Build Pulau APK
on:
  push:
    paths-ignore:
      - '.github/workflows/fetch_assets.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
env:
  GODOT_VERSION: "4.3"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        run: |
          mkdir -p ~/godot-cache && cd ~/godot-cache
          B=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          [ -f godot.zip ] || curl -fsSL -o godot.zip $B/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz $B/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -oq godot.zip && sudo mv -f Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T && unzip -oq templates.tpz 'templates/android_*' -d /tmp/t && cp /tmp/t/templates/* $T/ && cp /tmp/t/templates/../templates/* $T/ 2>/dev/null || true
          unzip -oq templates.tpz 'templates/version.txt' -d /tmp/t && cp /tmp/t/templates/version.txt $T/
          ls -la $T
      - name: Configure Android signing + SDK
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            mkdir -p ~/.config/godot
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
            sed -i 's/^          //' ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.3.tres
      - name: Import + export
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          timeout 600 godot --headless --editor --quit --path . || true
          godot --headless --path . --export-release "Android" build/Pulau.apk
          ls -la build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pulau-latest -y --cleanup-tag || true
          gh release create pulau-latest build/Pulau.apk --target ${{ github.sha }} \
            --title "Pulau (build terbaru)" --notes "APK otomatis dari branch pulau, commit ${{ github.sha }}" --prerelease
